name: CI
on:
  pull_request:
  push:
    branches: [master]

jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:15-3.4
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
      - uses: pnpm/action-setup@v3
        with:
          version: 9
      - run: pnpm install --frozen-lockfile
      - run: node scripts/check-single-types-react.mjs
      - run: pnpm --filter @gurmego/api exec prisma migrate deploy
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
      - run: pnpm run lint
      - run: pnpm run typecheck
      - run: pnpm run test
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
          SUPABASE_JWKS_URL: http://localhost:54321/auth/v1/.well-known/jwks.json
      - run: pnpm exec turbo run build
        env:
          # apps/web and apps/admin construct a Supabase client at module scope in pages that get
          # statically prerendered during `next build` -- a real project (or, locally, a
          # gitignored .env.local) is needed to *construct* the client even though no network call
          # happens until a real user interacts with it in the browser. Dummy but well-formed
          # values are enough; see apps/web/.env.example and apps/admin/.env.example.
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
          NEXT_PUBLIC_API_BASE_URL: http://localhost:3001/v1
      - run: bash scripts/smoke-api.sh
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
          SUPABASE_JWKS_URL: http://localhost:54321/auth/v1/.well-known/jwks.json
          # BLOCKER fix (final whole-branch review): rule-config.ts (Task 20) made these three
          # required at apps/api module-load time (throws if absent) -- intentional, closing a
          # "silently hardcoded threshold" architecture violation. The smoke-API step boots the
          # real app, so it needs them too, same as local dev's apps/api/.env.example. Values match
          # that file's documented real-deployment defaults (also mirrored in
          # apps/api/test/env-defaults.setup.ts for the Jest step above).
          RULES_BOUTIQUE_MAX_BRANCHES: "3"
          RULES_STALE_DAYS: "90"
          RULES_MOD_AUTO_HIDE_REPORTS: "3"
